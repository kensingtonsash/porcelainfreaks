<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porcelain Freaks — Stock</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet" />

    <style>
      :root {
        --rail: #161c26; --rail-line: #29313d; --rail-text: #aab4c1; --rail-dim: #6c7889;
        --canvas: #f4f6f8; --surface: #ffffff; --ink: #1b2430; --muted: #67727f;
        --line: #e3e7ec; --line-soft: #eef1f4;
        --accent: #2f6fb0; --accent-ink: #245a92; --accent-soft: #e9f1f9;
        --positive: #2f7d5f; --positive-soft: #e3f0e9; --warn: #9a6a20; --warn-soft: #f6ecd8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; font-size: 14px; -webkit-text-size-adjust: 100%; }
      button { cursor: pointer; border: none; font-family: inherit; background: none; color: inherit; }
      input, select { font-family: inherit; outline: none; color: var(--ink); }
      input::placeholder { color: #9aa4b0; }
      input:focus, select:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); }
      table { border-spacing: 0; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

      .app { display: flex; min-height: 100%; }
      .rail { width: 236px; flex-shrink: 0; background: var(--rail); color: var(--rail-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
      .brand { padding: 22px 20px 18px; border-bottom: 1px solid var(--rail-line); }
      .brand-mark { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--rail-dim); font-weight: 600; }
      .brand-name { font-size: 21px; font-weight: 700; color: #fff; margin-top: 5px; letter-spacing: -0.01em; line-height: 1.05; }
      .brand-tally { margin-top: 14px; display: flex; align-items: baseline; gap: 7px; }
      .brand-tally b { font-size: 20px; color: #fff; font-weight: 600; }
      .brand-tally span { font-size: 11px; color: var(--rail-dim); text-transform: uppercase; letter-spacing: 0.08em; }
      .nav { padding: 12px 12px; display: flex; flex-direction: column; gap: 2px; }
      .nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--rail-text); text-align: left; width: 100%; transition: background .12s ease, color .12s ease; }
      .nav-item:hover { background: rgba(255,255,255,0.045); color: #e7ebf0; }
      .nav-item.active { background: rgba(47,111,176,0.16); color: #fff; }
      .nav-item .badge { margin-left: auto; font-size: 11px; color: var(--rail-dim); font-family: "IBM Plex Mono", monospace; }
      .nav-item.active .badge { color: #cddcec; }
      .rail-foot { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--rail-line); font-size: 11px; color: var(--rail-dim); line-height: 1.55; }
      .sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--rail-dim); margin-bottom: 9px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #4b9e78; box-shadow: 0 0 0 3px rgba(75,158,120,0.18); }
      .dot.off { background: #b06b4c; box-shadow: 0 0 0 3px rgba(176,107,76,0.18); }

      .workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .toolbar { display: flex; align-items: center; gap: 16px; padding: 18px 26px; border-bottom: 1px solid var(--line); background: var(--surface); }
      .toolbar h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
      .toolbar .sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
      .toolbar-actions { margin-left: auto; display: flex; gap: 8px; }
      .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 7px; font-size: 13px; font-weight: 550; }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-ink); }
      .btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
      .btn-ghost:hover { background: var(--canvas); border-color: #cfd6de; }
      .search { display: flex; align-items: center; gap: 8px; flex: 1; max-width: 340px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
      .search input { border: none; flex: 1; font-size: 13.5px; background: none; }
      .search input:focus { box-shadow: none; }
      .filter { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; font-weight: 500; color: var(--ink); }

      .metrics { display: flex; flex-wrap: wrap; padding: 0 26px; border-bottom: 1px solid var(--line); background: var(--surface); }
      .metric { padding: 13px 26px 13px 0; margin-right: 26px; border-right: 1px solid var(--line-soft); }
      .metric:last-child { border-right: none; margin-right: 0; padding-right: 0; }
      .metric .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
      .metric .v { font-size: 19px; font-weight: 600; margin-top: 3px; letter-spacing: -0.01em; }

      .content { padding: 22px 26px 40px; }
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; }
      .panel-head { padding: 15px 18px 13px; border-bottom: 1px solid var(--line-soft); }
      .panel-head h3 { font-size: 14.5px; font-weight: 600; }
      .panel-head p { font-size: 12px; color: var(--muted); margin-top: 2px; }
      .panel-body { padding: 16px 18px; }

      .ledger { width: 100%; border-collapse: collapse; }
      .ledger thead th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 0 14px 11px; white-space: nowrap; border-bottom: 1px solid var(--line); background: var(--surface); }
      .ledger tbody td { padding: 11px 14px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
      .ledger tbody tr:last-child td { border-bottom: none; }
      .ledger tbody tr:hover td { background: #fafbfc; }
      .r { text-align: right; }
      .chip { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
      .rm { color: #a6afb9; padding: 4px; border-radius: 6px; display: inline-flex; }
      .rm:hover { color: #d0453e; background: #fbe9e8; }
      .empty { text-align: center; padding: 44px 20px; color: var(--muted); font-size: 13.5px; }
      .empty b { color: var(--ink); display: block; font-size: 15px; margin-bottom: 4px; font-weight: 600; }
      .grid2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 16px; }
      .grid-cards { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }

      .scrim { position: fixed; inset: 0; background: rgba(19,26,36,0.5); display: flex; align-items: flex-start; justify-content: center; padding: 7vh 16px; z-index: 50; }
      .modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 560px; box-shadow: 0 24px 70px rgba(19,26,36,0.35); overflow: hidden; }
      .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
      .modal-head h3 { font-size: 16px; font-weight: 600; }
      .modal-body { padding: 18px 20px; max-height: 62vh; overflow-y: auto; }
      .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--canvas); }
      .field { display: block; margin-bottom: 13px; }
      .field span { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
      .field input, .field select { width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; margin-top: 5px; }
      .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

      .banner { margin: 14px 26px 0; padding: 10px 14px; border-radius: 8px; font-size: 13px; background: #fbe9e8; color: #a4362f; border: 1px solid #f2c9c6; }
      .loading { padding: 60px 20px; text-align: center; color: var(--muted); }

      @media (max-width: 860px) {
        .rail { width: auto; height: auto; position: static; flex-direction: column; }
        .app { flex-direction: column; }
        .brand { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; }
        .brand-tally { margin-top: 0; }
        .nav { flex-direction: row; overflow-x: auto; padding: 8px 10px; }
        .nav-item { white-space: nowrap; }
        .nav-item .badge { display: none; }
        .rail-foot { display: none; }
        .grid2, .grid-cards { grid-template-columns: 1fr; }
        .toolbar { flex-wrap: wrap; }
        .search { max-width: none; order: 3; flex-basis: 100%; }
      }

      /* Mobile stock cards */
      .scards { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
      .scard { border: 1px solid var(--line); border-radius: 11px; padding: 12px; background: var(--surface); }
      .sfig { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px 8px; margin-top: 12px; }
      .sfig .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
      .sfig .v { font-size: 14px; font-weight: 600; margin-top: 2px; }

      .add-coll { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: end; }
      .add-coll .field { margin: 0; }
      @media (max-width: 720px) { .add-coll { grid-template-columns: 1fr; } .add-coll .btn { width: 100%; justify-content: center; } }

      @media (max-width: 720px) {
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); padding: 12px 14px; gap: 12px 10px; }
        .metric { margin: 0; padding: 0; border-right: none; }
        .metric .v { font-size: 17px; }
        .content { padding: 14px 12px 40px; }
        .toolbar { padding: 13px 14px; gap: 10px; }
        .toolbar h2 { font-size: 16px; }
        .frow { grid-template-columns: 1fr; }
        .panel-body { padding: 14px; }
        .btn { padding: 9px 13px; }

        /* 16px inputs stop iOS Safari auto-zooming (and panning) on focus */
        input, select, textarea,
        .field input, .field select, .search input, .filter { font-size: 16px; }

        /* Add/Log forms become a full-height sheet: header on top, body
           scrolls, Save pinned at the bottom above the home bar. */
        .scrim { padding: 0; align-items: stretch; }
        .modal { max-width: none; width: 100%; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; display: flex; flex-direction: column; }
        .modal-head { flex-shrink: 0; }
        .modal-body { max-height: none; flex: 1; overscroll-behavior: contain; }
        .modal-foot { flex-shrink: 0; position: sticky; bottom: 0; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
        .modal-foot .btn { flex: 1; justify-content: center; }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.383.0?deps=react@18.3.1",
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.4"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
      import React, { useState, useEffect, useMemo, useCallback, useRef } from "react";
      import { createRoot } from "react-dom/client";
      import { createClient } from "@supabase/supabase-js";
      import {
        Boxes, LayoutGrid, Archive, Truck, Plus, Ship, Trash2, X,
        Search, PoundSterling, ArrowUpRight, ArrowDownRight, LogOut, ImagePlus,
      } from "lucide-react";

      /* ======================================================================
         Supabase — the single source of truth for stock, parcels, collections.
         The publishable key is safe to ship in a public page; these tables are
         guarded by row-level security and hold no personal data.
      ====================================================================== */
      const SUPABASE_URL = "https://wuzcvgucszxoefcscqkd.supabase.co";
      const SUPABASE_KEY = "sb_publishable_uD56klle2WOzdHfKHVMEWA_K4YhIQNE";
      const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

      // DB (snake_case) <-> app (camelCase)
      const itemFromRow = (r) => ({
        id: r.id, product: r.product, collection: r.collection, brand: r.brand, source: r.source,
        purchase: Number(r.purchase) || 0, inbound: Number(r.inbound) || 0, status: r.status, location: r.location || "London",
        listPrice: r.list_price == null ? null : Number(r.list_price),
        salePrice: r.sale_price == null ? null : Number(r.sale_price),
        saleDate: r.sale_date || null, channel: r.channel, shipment: r.shipment, imageUrl: r.image_url || null,
      });
      const itemToRow = (it) => ({
        id: it.id, product: it.product, collection: it.collection, brand: it.brand, source: it.source,
        purchase: it.purchase, inbound: it.inbound, status: it.status, location: it.location,
        list_price: it.listPrice, sale_price: it.salePrice, sale_date: it.saleDate,
        channel: it.channel, shipment: it.shipment, image_url: it.imageUrl || null,
      });

      // Upload a photo to Supabase Storage and return its public URL.
      const IMG_BUCKET = "pf-images";
      async function uploadItemImage(file, id) {
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
        const path = `${id}/${Date.now()}.${ext}`;
        const { error } = await sb.storage.from(IMG_BUCKET).upload(path, file, { upsert: true, contentType: file.type });
        if (error) throw error;
        return sb.storage.from(IMG_BUCKET).getPublicUrl(path).data.publicUrl;
      }
      const shipFromRow = (r) => ({ id: r.id, date: r.date, outbound: Number(r.outbound) || 0, customs: Number(r.customs) || 0, note: r.note });

      /* ======================================================================
         Status vocabulary + chip styling
      ====================================================================== */
      const STATUSES = ["sourced", "listed", "sold"];
      const STATUS_STYLE = {
        sourced: { bg: "#eef1f4", fg: "#67727f" },
        listed:  { bg: "#e2edfa", fg: "#245a92" },
        sold:    { bg: "#e3f0e9", fg: "#2f7d5f" },
      };

      // Where a piece physically is — separate from its sales status.
      const LOCATIONS = ["London", "In transit", "Moscow"];
      const LOCATION_STYLE = {
        "London":     { bg: "#eef1f4", fg: "#67727f" },
        "In transit": { bg: "#f6ecd8", fg: "#9a6a20" },
        "Moscow":     { bg: "#e9f1f9", fg: "#2f6fb0" },
      };

      /* ======================================================================
         Formatting
      ====================================================================== */
      const money = (n) => (n < 0 ? "-" : "") + "£" + Math.abs(n).toLocaleString("en-GB", { maximumFractionDigits: 0 });
      const pct = (n) => (n === null || !isFinite(n) ? "—" : Math.round(n) + "%");

      /* ======================================================================
         Landed-cost engine + rollups
      ====================================================================== */
      function enrich(items, shipments) {
        const shipTotals = {};
        items.forEach((it) => { if (it.shipment) shipTotals[it.shipment] = (shipTotals[it.shipment] || 0) + it.purchase; });
        const shipMap = Object.fromEntries(shipments.map((s) => [s.id, s]));
        return items.map((it) => {
          const s = it.shipment ? shipMap[it.shipment] : null;
          let apportioned = 0, estimated = false;
          if (s) {
            const parcelCost = (s.outbound || 0) + (s.customs || 0);
            const share = shipTotals[it.shipment] ? it.purchase / shipTotals[it.shipment] : 0;
            apportioned = parcelCost * share;
          } else if (it.location !== "London") { estimated = true; }
          const landed = it.purchase + (it.inbound || 0) + apportioned;
          const sold = it.status === "sold" && it.salePrice != null;
          const profit = sold ? it.salePrice - landed : null;
          const margin = sold && landed > 0 ? (profit / landed) * 100 : null;
          return { ...it, apportioned, landed, sold, profit, margin, estimated };
        });
      }
      function rollups(enriched) {
        const sold = enriched.filter((i) => i.sold);
        const stock = enriched.filter((i) => !i.sold);
        const revenue = sold.reduce((a, i) => a + i.salePrice, 0);
        const profit = sold.reduce((a, i) => a + i.profit, 0);
        const stockValue = stock.reduce((a, i) => a + i.landed, 0);
        const margins = sold.filter((i) => i.margin != null).map((i) => i.margin);
        const avgMargin = margins.length ? margins.reduce((a, b) => a + b, 0) / margins.length : null;
        return { revenue, profit, stockValue, inStock: stock.length, soldCount: sold.length, avgMargin };
      }
      function byMonth(enriched) {
        const map = {};
        enriched.forEach((i) => {
          if (!i.sold || !i.saleDate) return;
          const key = i.saleDate.slice(0, 7);
          if (!map[key]) map[key] = { key, revenue: 0, profit: 0, count: 0, marginSum: 0, marginN: 0 };
          map[key].revenue += i.salePrice; map[key].profit += i.profit; map[key].count += 1;
          if (i.margin != null) { map[key].marginSum += i.margin; map[key].marginN++; }
        });
        return map;
      }
      const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      const monthLabel = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" }); };

      const BRANDS = ["Villeroy & Boch", "Royal Doulton", "Christofle", "Royal Copenhagen", "Lladró", "Wedgwood", "Belleek"];
      // Work out the brand from the collection name (names carry the brand prefix).
      function guessBrand(name) {
        const s = (name || "").toLowerCase();
        if (s.includes("royal doulton")) return "Royal Doulton";
        if (s.includes("christofle")) return "Christofle";
        if (s.includes("royal copenhagen")) return "Royal Copenhagen";
        if (s.includes("lladro") || s.includes("lladró")) return "Lladró";
        if (s.includes("wedgwood")) return "Wedgwood";
        if (s.includes("belleek")) return "Belleek";
        return "Villeroy & Boch";
      }

      // Build an SKU prefix from a collection name (used only when the
      // collection has no items yet to copy a prefix from).
      function skuPrefixFromName(name) {
        const map = [["royal doulton", "RD"], ["royal copenhagen", "RC"], ["christofle", "CH"], ["lladró", "LL"], ["lladro", "LL"], ["wedgwood", "WW"], ["belleek", "BK"], ["villeroy", "VB"], ["v&b", "VB"]];
        const lower = (name || "").toLowerCase();
        let brand = null, rest = name || "";
        for (const [k, code] of map) { if (lower.includes(k)) { brand = code; rest = (name || "").replace(new RegExp(k, "i"), " "); break; } }
        const words = rest.replace(/[^a-zA-Z ]+/g, " ").split(/\s+/).filter(Boolean);
        let series = "GEN";
        if (words.length === 1) series = words[0].slice(0, 3).toUpperCase();
        else if (words.length >= 2) series = words.map((w) => w[0]).join("").slice(0, 3).toUpperCase();
        const bc = brand || (words[0] ? words[0].slice(0, 2).toUpperCase() : "XX");
        return `${bc}-${series}-`;
      }

      function byCollection(enriched, collectionList) {
        const map = {};
        collectionList.forEach((c) => { map[c.name] = { name: c.name, brand: c.brand, inStock: 0, sold: 0, profit: 0, stockValue: 0 }; });
        enriched.forEach((i) => {
          const key = i.collection || "Unassigned";
          if (!map[key]) map[key] = { name: key, brand: i.brand, inStock: 0, sold: 0, profit: 0, stockValue: 0 };
          if (i.sold) { map[key].sold++; map[key].profit += i.profit; }
          else { map[key].inStock++; map[key].stockValue += i.landed; }
        });
        return Object.values(map).sort((a, b) => b.inStock + b.sold - (a.inStock + a.sold));
      }

      /* ======================================================================
         Small building blocks
      ====================================================================== */
      const Chip = ({ status }) => { const st = STATUS_STYLE[status] || STATUS_STYLE.sourced; return <span className="chip" style={{ background: st.bg, color: st.fg }}>{status}</span>; };
      const LocChip = ({ loc }) => { const st = LOCATION_STYLE[loc] || LOCATION_STYLE["London"]; return <span className="chip" style={{ background: st.bg, color: st.fg }}>{loc || "London"}</span>; };

      // Ledger thumbnail: shows the photo (tap to enlarge) or an upload button.
      function Thumb({ item, onSetImage, onZoom }) {
        const [busy, setBusy] = useState(false);
        const inputRef = useRef(null);
        const onFile = async (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          setBusy(true);
          try { const url = await uploadItemImage(file, item.id); await onSetImage(item.id, url); }
          catch (err) { alert("Upload failed: " + err.message); }
          setBusy(false);
        };
        return (
          <div style={{ width: 46, height: 46 }}>
            <input ref={inputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={onFile} />
            {item.imageUrl ? (
              <img src={item.imageUrl} alt={item.product} onClick={() => onZoom(item)} style={{ width: 46, height: 46, objectFit: "cover", borderRadius: 7, border: "1px solid var(--line)", cursor: "zoom-in", display: "block" }} />
            ) : (
              <button onClick={() => inputRef.current && inputRef.current.click()} title="Add photo" style={{ width: 46, height: 46, borderRadius: 7, border: "1px dashed #c7cfd8", color: "var(--muted)", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--canvas)" }}>
                {busy ? "…" : <ImagePlus size={17} />}
              </button>
            )}
          </div>
        );
      }

      // Full-size photo view with replace / remove.
      function Lightbox({ item, onClose, onSetImage, onClearImage }) {
        const [busy, setBusy] = useState(false);
        const inputRef = useRef(null);
        const onFile = async (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          setBusy(true);
          try { const url = await uploadItemImage(file, item.id); await onSetImage(item.id, url); }

      function Metric({ k, v, tone }) { return (<div className="metric"><div className="k">{k}</div><div className="v mono" style={{ color: tone === "positive" ? "var(--positive)" : "var(--ink)" }}>{v}</div></div>); }
      function MiniStat({ k, v, tone }) {
        const color = tone === "positive" ? "var(--positive)" : tone === "accent" ? "var(--accent)" : "var(--ink)";

      function useIsMobile(bp = 720) {

        useEffect(() => {
          const mq = window.matchMedia(`(max-width:${bp}px)`);
          const on = () => setM(mq.matches);
          mq.addEventListener("change", on);
          return () => mq.removeEventListener("change", on);
        }, [bp]);
        return m;
      }

      function Delta({ now, prev }) {

                <div><div style={{ fontSize: 10.5, textTransform: "uppercase", letterSpacing: "0.07em", color: "var(--muted)", fontWeight: 600 }}>Profit</div><div className="mono" style={{ fontSize: 30, fontWeight: 600, letterSpacing: "-0.02em", margin: "4px 0 7px", color: "var(--positive)" }}>{money(data.profit)}</div>{prev && <Delta now={data.profit} prev={prev.profit} />}</div>

      function Financials({ enriched }) {
        const map = byMonth(enriched); const now = new Date();
        const thisKey = monthKey(now); const lastKey = monthKey(new Date(now.getFullYear(), now.getMonth() - 1, 1));
        const blank = { revenue: 0, profit: 0, count: 0, marginSum: 0, marginN: 0 };

                          <td className="r mono" style={{ color: "var(--positive)", fontWeight: 600 }}>{money(m.profit)}</td>

              {undated > 0 && (<div style={{ padding: "11px 16px", borderTop: "1px solid var(--line-soft)", fontSize: 11.5, color: "var(--muted)" }}>{undated} sold {undated === 1 ? "piece isn't" : "pieces aren't"} dated, so {undated === 1 ? "it isn't" : "they aren't"} counted above.</div>)}

      /* ======================================================================

      function Modal({ title, children, onClose, onSave, saveLabel }) {
        return (
          <div className="scrim" onClick={onClose}>

      }
      const F = ({ label, ...p }) => (<label className="field"><span>{label}</span><input {...p} /></label>);
      const Sel = ({ label, value, onChange, options, optionLabels = {} }) => (<label className="field"><span>{label}</span><select value={value} onChange={onChange}>{options.map((o) => <option key={o} value={o}>{optionLabels[o] ?? (o || "—")}</option>)}</select></label>);

      function ItemForm({ onClose, onSave, shipments, collections, existing }) {
        const [f, setF] = useState({ id: "", product: "", collection: "", brand: "", source: "eBay UK", purchase: "", status: "sourced", location: "London", listPrice: "", salePrice: "", saleDate: "", channel: "", shipment: "", imageUrl: null });
        const [photo, setPhoto] = useState(null);
        const [busy, setBusy] = useState(false);
        const [skuEdited, setSkuEdited] = useState(false);
        const set = (k) => (e) => setF({ ...f, [k]: e.target.value });

        // Distinct products already in stock, so a repeat buy can be picked
        // from a list instead of re-identified. Rebuilds from live stock.
        const catalogue = (() => {
          const seen = new Map();
          existing.forEach((it) => {
            const key = `${it.product}||${it.collection}`;
            if (!seen.has(key)) seen.set(key, { key, product: it.product, collection: it.collection, brand: it.brand, sku: it.id, imageUrl: it.imageUrl || null });
            else { const e = seen.get(key); if (!e.imageUrl && it.imageUrl) e.imageUrl = it.imageUrl; }
          });
          return Array.from(seen.values()).sort((a, b) => a.product.localeCompare(b.product));
        })();
        const suggestSku = (sku) => {
          const m = String(sku || "").match(/^(.*?)(\d+)$/);
          if (!m) return "";
          const prefix = m[1], width = m[2].length;
          let max = 0;
          existing.forEach((it) => { const mm = String(it.id).match(/^(.*?)(\d+)$/); if (mm && mm[1] === prefix) max = Math.max(max, parseInt(mm[2], 10)); });
          return prefix + String(max + 1).padStart(width, "0");
        };
        const onReorder = (key) => {
          const c = catalogue.find((x) => x.key === key);
          if (!c) return;
          setF((prev) => ({ ...prev, product: c.product, collection: c.collection, brand: c.brand, id: suggestSku(c.sku), imageUrl: c.imageUrl || null }));
        };

        // Next accurate SKU for a collection: copy the collection's own code
        // prefix and increment; fall back to a derived prefix for new ones.
        const nextSkuForCollection = (collection) => {
          if (!collection) return "";
          const prefixes = {}; let width = 3;
          existing.filter((i) => i.collection === collection).forEach((i) => {
            const m = String(i.id).match(/^(.*?)(\d+)$/);
            if (m) { prefixes[m[1]] = (prefixes[m[1]] || 0) + 1; width = m[2].length; }
          });
          const prefix = Object.keys(prefixes).length
            ? Object.entries(prefixes).sort((a, b) => b[1] - a[1])[0][0]
            : skuPrefixFromName(collection);
          let max = 0;
          existing.forEach((i) => { const m = String(i.id).match(/^(.*?)(\d+)$/); if (m && m[1] === prefix) max = Math.max(max, parseInt(m[2], 10)); });
          return prefix + String(max + 1).padStart(width, "0");
        };

        const doSave = async () => {
          const id = f.id.trim() || nextSkuForCollection(f.collection);
          if (!id) { alert("Choose a collection so a SKU can be generated, or type one in."); return; }
          if (existing.some((x) => x.id === id)) { alert("That SKU already exists — give it a unique one."); return; }
          if (!f.collection) { alert("Choose a collection for this piece."); return; }
          const isSold = f.status === "sold" && f.salePrice;
          const saleDate = f.saleDate || (isSold ? new Date().toISOString().slice(0, 10) : null);
          let imageUrl = f.imageUrl || null;
          if (photo) { setBusy(true); try { imageUrl = await uploadItemImage(photo, id); } catch (e) { alert("Photo upload failed: " + e.message); } setBusy(false); }
          onSave({ id, product: f.product || "Untitled piece", collection: f.collection || "Unassigned", brand: f.brand, source: f.source, purchase: +f.purchase || 0, inbound: 0, status: f.status, location: f.location, listPrice: f.listPrice ? +f.listPrice : null, salePrice: f.salePrice ? +f.salePrice : null, saleDate, channel: f.channel || null, shipment: f.shipment || null, imageUrl });
        };
        return (
          <Modal title="Add a piece" onClose={onClose} onSave={doSave} saveLabel={busy ? "Uploading photo…" : "Save"}>
            {catalogue.length > 0 && (
              <label className="field"><span>Reorder an existing piece</span>
                <select value="" onChange={(e) => e.target.value && onReorder(e.target.value)}>
                  <option value="">— New piece (fill in below) —</option>
                  {catalogue.map((c) => <option key={c.key} value={c.key}>{c.product} — {c.collection}</option>)}
                </select>
              </label>
            )}
            <div className="frow"><F label="SKU" placeholder="auto from collection" value={f.id} onChange={(e) => { setSkuEdited(true); const v = e.target.value; setF((p) => ({ ...p, id: v })); }} /><F label="Product / model" placeholder="Greenland teapot" value={f.product} onChange={set("product")} /></div>
            <label className="field"><span>Photo</span>
              <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 5 }}>
                {photo ? <img src={URL.createObjectURL(photo)} alt="" style={{ width: 48, height: 48, objectFit: "cover", borderRadius: 7, border: "1px solid var(--line)" }} /> : f.imageUrl ? <img src={f.imageUrl} alt="" style={{ width: 48, height: 48, objectFit: "cover", borderRadius: 7, border: "1px solid var(--line)" }} /> : <div style={{ width: 48, height: 48, borderRadius: 7, border: "1px dashed #c7cfd8", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--muted)" }}><ImagePlus size={18} /></div>}
                <div style={{ fontSize: 12, color: "var(--muted)" }}>
                  <input type="file" accept="image/*" onChange={(e) => setPhoto(e.target.files && e.target.files[0])} style={{ fontSize: 12.5 }} />
                  {f.imageUrl && !photo && <div style={{ marginTop: 3 }}>Using the existing photo — choose a file to replace it.</div>}
                </div>
              </div>
            </label>
            <div className="frow">
              <label className="field"><span>Collection</span><select value={f.collection} onChange={(e) => { const name = e.target.value; const c = collections.find((x) => x.name === name); setF((p) => ({ ...p, collection: name, brand: c ? c.brand : p.brand, id: skuEdited ? p.id : (name ? nextSkuForCollection(name) : "") })); }}><option value="">— Choose collection —</option>{collections.map((c) => <option key={c.name} value={c.name}>{c.name}</option>)}</select></label>
              <F label="Brand" placeholder="Villeroy & Boch" value={f.brand} onChange={set("brand")} />
            </div>
            <div className="frow"><Sel label="Source" value={f.source} onChange={set("source")} options={["eBay UK", "Vinted", "Subito.it", "Leboncoin", "Other"]} /><F label="Purchase price (£)" type="number" placeholder="total paid, inc. delivery" value={f.purchase} onChange={set("purchase")} /></div>
            <div className="frow"><Sel label="Status" value={f.status} onChange={set("status")} options={STATUSES} /><Sel label="Location" value={f.location} onChange={set("location")} options={LOCATIONS} /></div>
            <label className="field"><span>Parcel</span><select value={f.shipment} onChange={set("shipment")}><option value="">— none yet —</option>{shipments.map((s) => <option key={s.id} value={s.id}>{s.id}</option>)}</select></label>
            {(f.status === "listed" || f.status === "sold") && (
              <div className="frow"><F label="List price (£)" type="number" value={f.listPrice} onChange={set("listPrice")} />{f.status === "sold" ? <F label="Sale price (£)" type="number" value={f.salePrice} onChange={set("salePrice")} /> : <span />}</div>
            )}
            {f.status === "sold" && (
              <div className="frow"><F label="Sale date" type="date" value={f.saleDate} onChange={set("saleDate")} /><F label="Sale channel" placeholder="Avito" value={f.channel} onChange={set("channel")} /></div>
            )}
          </Modal>
        );
      }

      function ShipmentForm({ onClose, onSave, existing }) {
        const [f, setF] = useState({ id: "", date: new Date().toISOString().slice(0, 10), outbound: "", customs: "", note: "" });
        const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
        const doSave = () => {
          const id = f.id.trim() || `P-${(existing.length + 1).toString().padStart(3, "0")}`;
          if (existing.some((x) => x.id === id)) { alert("That parcel code already exists."); return; }
          onSave({ id, date: f.date, outbound: +f.outbound || 0, customs: +f.customs || 0, note: f.note });
        };
        return (
          <Modal title="Log a parcel" onClose={onClose} onSave={doSave}>
            <div className="frow"><F label="Parcel code" placeholder="P-003 (auto if blank)" value={f.id} onChange={set("id")} /><F label="Date sent" type="date" value={f.date} onChange={set("date")} /></div>
            <div className="frow"><F label="Outbound shipping (£)" type="number" value={f.outbound} onChange={set("outbound")} /><F label="Customs paid (£)" type="number" value={f.customs} onChange={set("customs")} /></div>
            <F label="Note" placeholder="What's in it / anything customs did" value={f.note} onChange={set("note")} />
            <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 8 }}>Assign pieces to this parcel from each piece's record. Its outbound + customs cost then spreads across those pieces by value.</div>
          </Modal>
        );
      }

      /* ======================================================================
         App shell
      ====================================================================== */
      const NAV = [
        ["stock", "Stock", Boxes], ["overview", "Overview", LayoutGrid], ["financials", "Financials", PoundSterling],
        ["collections", "Collections", Archive], ["parcels", "Parcels", Truck],
      ];
      const VIEW_META = {
        stock:       { title: "Stock register", sub: "Every physical piece, from source to sold." },
        overview:    { title: "Overview", sub: "How the stock and the money are moving." },
        financials:  { title: "Financials", sub: "Revenue and profit, month by month." },
        collections: { title: "Collections", sub: "Series buyers are trying to complete." },
        parcels:     { title: "Parcels", sub: "Batches to Moscow, with real customs apportioned by value." },
      };

      function Dashboard({ onLogout }) {
        const [tab, setTab] = useState("stock");
        const [modal, setModal] = useState(null);
        const [query, setQuery] = useState("");
        const [statusFilter, setStatusFilter] = useState("all");
        const [zoom, setZoom] = useState(null);

        const [items, setItems] = useState([]);
        const [shipments, setShipments] = useState([]);
        const [collections, setCollections] = useState([]);
        const [loading, setLoading] = useState(true);
        const [online, setOnline] = useState(true);
        const [error, setError] = useState(null);

        const loadAll = useCallback(async () => {
          try {
            const [ci, si, ii] = await Promise.all([
              sb.from("pf_collections").select("*").order("sort", { ascending: true }),
              sb.from("pf_shipments").select("*").order("created_at", { ascending: true }),
              sb.from("pf_items").select("*").order("created_at", { ascending: false }),
            ]);
            if (ci.error || si.error || ii.error) throw (ci.error || si.error || ii.error);
            setCollections(ci.data.map((c) => ({ name: c.name, brand: c.brand })));
            setShipments(si.data.map(shipFromRow));
            setItems(ii.data.map(itemFromRow));
            setError(null); setOnline(true);
          } catch (e) {
            setError(e.message || "Couldn't reach the database."); setOnline(false);
          } finally { setLoading(false); }
        }, []);

        useEffect(() => {
          loadAll();
          const ch = sb.channel("pf-changes")
            .on("postgres_changes", { event: "*", schema: "public", table: "pf_items" }, loadAll)
            .on("postgres_changes", { event: "*", schema: "public", table: "pf_shipments" }, loadAll)
            .on("postgres_changes", { event: "*", schema: "public", table: "pf_collections" }, loadAll)
            .subscribe((status) => { if (status === "SUBSCRIBED") setOnline(true); });
          return () => { sb.removeChannel(ch); };
        }, [loadAll]);

        const enriched = useMemo(() => enrich(items, shipments), [items, shipments]);
        const kpi = useMemo(() => rollups(enriched), [enriched]);
        const collectionRollup = useMemo(() => byCollection(enriched, collections), [enriched, collections]);
        const maxColMagnitude = Math.max(1, ...collectionRollup.map((c) => c.inStock + c.sold));

        const ledgerRows = useMemo(() => {
          const q = query.trim().toLowerCase();
          return enriched.filter((it) => {
            if (statusFilter !== "all" && it.status !== statusFilter) return false;
            if (!q) return true;
            return [it.id, it.product, it.collection, it.source, it.brand, it.location].filter(Boolean).some((v) => v.toLowerCase().includes(q));
          });
        }, [enriched, query, statusFilter]);

        // Writes — go to Supabase; realtime refreshes every open instance.
        const addItem = async (it) => { setItems((xs) => [it, ...xs]); const { error } = await sb.from("pf_items").insert(itemToRow(it)); if (error) { alert("Save failed: " + error.message); loadAll(); } };
        const removeItem = async (id) => { setItems((xs) => xs.filter((x) => x.id !== id)); const { error } = await sb.from("pf_items").delete().eq("id", id); if (error) { alert("Remove failed: " + error.message); loadAll(); } };
        const setItemImage = async (id, url) => { setItems((xs) => xs.map((x) => (x.id === id ? { ...x, imageUrl: url } : x))); setZoom((z) => (z && z.id === id ? { ...z, imageUrl: url } : z)); const { error } = await sb.from("pf_items").update({ image_url: url }).eq("id", id); if (error) { alert("Save failed: " + error.message); loadAll(); } };
        const clearItemImage = async (id) => { setItems((xs) => xs.map((x) => (x.id === id ? { ...x, imageUrl: null } : x))); const { error } = await sb.from("pf_items").update({ image_url: null }).eq("id", id); if (error) { alert("Update failed: " + error.message); loadAll(); } };
        const addShipment = async (s) => { setShipments((xs) => [...xs, s]); const { error } = await sb.from("pf_shipments").insert(s); if (error) { alert("Save failed: " + error.message); loadAll(); } };
        const removeShipment = async (id) => {
          setShipments((xs) => xs.filter((x) => x.id !== id));
          setItems((xs) => xs.map((x) => (x.shipment === id ? { ...x, shipment: null } : x)));
          await sb.from("pf_items").update({ shipment: null }).eq("shipment", id);
          const { error } = await sb.from("pf_shipments").delete().eq("id", id);
          if (error) { alert("Remove failed: " + error.message); loadAll(); }
        };
        const addCollection = async (name, brand) => {
          if (collections.some((c) => c.name.toLowerCase() === name.toLowerCase())) { alert("That collection already exists."); return; }
          const b = (brand || "").trim() || guessBrand(name);
          setCollections((xs) => [...xs, { name, brand: b }]);
          const { error } = await sb.from("pf_collections").insert({ name, brand: b, sort: collections.length + 1 });
          if (error) { alert("Save failed: " + error.message); loadAll(); }
        };
        const removeCollection = async (name) => {
          const used = items.some((i) => i.collection === name);
          if (used) { alert("This collection still has pieces in it — move or remove those first."); return; }
          if (!confirm(`Delete the collection “${name}”?`)) return;
          setCollections((xs) => xs.filter((c) => c.name !== name));
          const { error } = await sb.from("pf_collections").delete().eq("name", name);
          if (error) { alert("Delete failed: " + error.message); loadAll(); }
        };
        const setCollectionBrand = async (name, brand) => {
          setCollections((xs) => xs.map((c) => (c.name === name ? { ...c, brand } : c)));
          const { error } = await sb.from("pf_collections").update({ brand }).eq("name", name);
          if (error) { alert("Update failed: " + error.message); loadAll(); }
        };

        const meta = VIEW_META[tab];

        return (
          <div className="app">
            <aside className="rail">
              <div className="brand">
                <div><div className="brand-mark">Stock system</div><div className="brand-name">Porcelain Freaks</div></div>
                <div className="brand-tally"><b className="mono">{kpi.inStock}</b><span>on hand</span></div>
              </div>
              <nav className="nav">
                {NAV.map(([key, label, Icon]) => {
                  const count = key === "stock" ? items.length : key === "collections" ? collections.length : key === "parcels" ? shipments.length : null;
                  return (<button key={key} className={"nav-item" + (tab === key ? " active" : "")} onClick={() => setTab(key)}><Icon size={16} /> {label}{count != null && <span className="badge">{count}</span>}</button>);
                })}
              </nav>
              <div className="rail-foot">
                <div className="sync"><span className={"dot" + (online ? "" : " off")} />{online ? "Synced to Supabase" : "Offline — retrying"}</div>
                <div>Landed cost = purchase (inc. delivery) + this piece's share of its parcel (outbound + customs), by value.</div>
                <button onClick={onLogout} style={{ marginTop: 11, color: "var(--rail-text)", fontSize: 12, display: "inline-flex", alignItems: "center", gap: 6, fontWeight: 500 }}><LogOut size={13} /> Sign out</button>
              </div>
            </aside>

            <main className="workspace">
              <div className="toolbar">
                <div><h2>{meta.title}</h2><div className="sub">{meta.sub}</div></div>
                {tab === "stock" && (
                  <>
                    <div className="search"><Search size={15} color="#9aa4b0" /><input placeholder="Search SKU, piece, collection…" value={query} onChange={(e) => setQuery(e.target.value)} /></div>
                    <select className="filter" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}><option value="all">All statuses</option>{STATUSES.map((s) => <option key={s} value={s}>{s}</option>)}</select>
                  </>
                )}
                <div className="toolbar-actions">
                  <button className="btn btn-ghost" onClick={() => setModal("shipment")}><Ship size={15} /> Log parcel</button>
                  <button className="btn btn-primary" onClick={() => setModal("item")}><Plus size={15} /> Add piece</button>
                </div>
              </div>

              <div className="metrics">
                <Metric k="On hand" v={kpi.inStock} /><Metric k="Stock value" v={money(kpi.stockValue)} /><Metric k="Sold" v={kpi.soldCount} />
                <Metric k="Revenue" v={money(kpi.revenue)} /><Metric k="Profit" v={money(kpi.profit)} tone="positive" /><Metric k="Avg margin" v={pct(kpi.avgMargin)} tone="positive" />
              </div>

              {error && <div className="banner">Can't reach Supabase: {error}. Showing the last data loaded; changes will retry automatically.</div>}

              <div className="content">
                {loading ? <div className="loading">Loading stock from Supabase…</div> : (<>
                  {tab === "stock" && <StockLedger rows={ledgerRows} query={query} setQuery={setQuery} onRemove={removeItem} onSetImage={setItemImage} onZoom={setZoom} />}
                  {tab === "overview" && <Overview collections={collectionRollup} maxColMagnitude={maxColMagnitude} enriched={enriched} />}
                  {tab === "financials" && <Financials enriched={enriched} />}
                  {tab === "collections" && <Collections collections={collectionRollup} enriched={enriched} onAddCollection={addCollection} onRemoveCollection={removeCollection} onSetBrand={setCollectionBrand} />}
                  {tab === "parcels" && <Parcels shipments={shipments} enriched={enriched} onRemove={removeShipment} />}
                </>)}
              </div>
            </main>

            {modal === "item" && <ItemForm onClose={() => setModal(null)} onSave={(it) => { addItem(it); setModal(null); }} shipments={shipments} collections={collections} existing={items} />}
            {modal === "shipment" && <ShipmentForm onClose={() => setModal(null)} onSave={(s) => { addShipment(s); setModal(null); }} existing={shipments} />}
            {zoom && zoom.imageUrl && <Lightbox item={zoom} onClose={() => setZoom(null)} onSetImage={setItemImage} onClearImage={clearItemImage} />}
          </div>
        );
      }

      /* ======================================================================
         Login gate — real Supabase Auth. Without a session the tables are
         unreachable (RLS restricts them to authenticated users).
      ====================================================================== */
      function Login() {
        const [u, setU] = useState("");
        const [p, setP] = useState("");
        const [err, setErr] = useState(null);
        const [busy, setBusy] = useState(false);
        const submit = async () => {
          if (!u.trim() || !p) return;
          setBusy(true); setErr(null);
          const email = u.includes("@") ? u.trim() : `${u.trim().toLowerCase()}@porcelainfreaks.app`;
          const { error } = await sb.auth.signInWithPassword({ email, password: p });
          setBusy(false);
          if (error) setErr("That username or password isn't right.");
          // On success, onAuthStateChange in App swaps the view in.
        };
        return (
          <div style={{ minHeight: "100%", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
            <div style={{ width: "100%", maxWidth: 360 }}>
              <div style={{ textAlign: "center", marginBottom: 22 }}>
                <div style={{ fontSize: 10, letterSpacing: "0.22em", textTransform: "uppercase", color: "var(--muted)", fontWeight: 600 }}>Stock system</div>
                <div style={{ fontSize: 26, fontWeight: 700, letterSpacing: "-0.01em", marginTop: 5 }}>Porcelain Freaks</div>
              </div>
              <div className="panel">
                <div className="panel-body">
                  <label className="field"><span>Username</span><input autoFocus value={u} onChange={(e) => setU(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} /></label>
                  <label className="field"><span>Password</span><input type="password" value={p} onChange={(e) => setP(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} /></label>
                  {err && <div style={{ fontSize: 12.5, color: "#c0453e", marginBottom: 10 }}>{err}</div>}
                  <button className="btn btn-primary" style={{ width: "100%", justifyContent: "center" }} onClick={submit} disabled={busy}>{busy ? "Signing in…" : "Sign in"}</button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function App() {
        const [session, setSession] = useState(undefined); // undefined = still checking
        useEffect(() => {
          sb.auth.getSession().then(({ data }) => setSession(data.session));
          const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
          return () => sub.subscription.unsubscribe();
        }, []);
        if (session === undefined) return <div className="loading" style={{ paddingTop: 120 }}>Loading…</div>;
        if (!session) return <Login />;
        return <Dashboard onLogout={() => sb.auth.signOut()} />;
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
